[project]
name = "qho-demo"
version = "0.1.0"
description = "Quantum harmonic oscillator: finite-difference Schrödinger solver + interactive visualisation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]
assets = ["matplotlib>=3.7", "python-pptx>=0.6.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["qho"]
